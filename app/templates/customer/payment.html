{% extends "base.html" %}
{% block title %}Complete Payment{% endblock %}
{% block extra_head %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto py-10">
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 text-center">
    <div class="text-4xl mb-4">💳</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Complete Your Payment</h1>
    <p class="text-gray-500 mb-6">Order <strong>#{{ order.order_number }}</strong> — ₹{{ "%.0f"|format(total) }}</p>

    <form id="payment-form" method="post" action="/customer/checkout/payment-success">
      <input type="hidden" name="order_id" value="{{ order.id }}"/>
      <input type="hidden" id="razorpay_payment_id" name="razorpay_payment_id"/>
      <input type="hidden" id="razorpay_order_id" name="razorpay_order_id"/>
      <input type="hidden" id="razorpay_signature" name="razorpay_signature"/>
    </form>

    <button id="pay-btn"
            class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 text-lg">
      Pay ₹{{ "%.0f"|format(total) }}
    </button>
  </div>
</div>

{% block extra_js %}
<script>
const options = {
  key: "{{ razorpay_key }}",
  amount: {{ (total * 100)|int }},
  currency: "INR",
  name: "VendorNest",
  description: "Order #{{ order.order_number }}",
  order_id: "{{ rz_order.id }}",
  handler: function(response) {
    document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
    document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
    document.getElementById('razorpay_signature').value = response.razorpay_signature;
    document.getElementById('payment-form').submit();
  },
  prefill: { email: "{{ user.email }}", contact: "{{ user.phone or '' }}" },
  theme: { color: "#2563eb" }
};
document.getElementById('pay-btn').onclick = function() {
  const rzp = new Razorpay(options);
  rzp.open();
};
</script>
{% endblock %}
{% endblock %}
