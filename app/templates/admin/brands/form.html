{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit Brand' if brand else 'Add Brand' }}{% endblock %}
{% block page_title %}{{ 'Edit Brand' if brand else 'Add Brand' }}{% endblock %}
{% block content %}
<div class="max-w-lg">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <form method="post" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Brand Name *</label>
        <input type="text" name="name" value="{{ brand.name if brand else '' }}" required
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea name="description" rows="3"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{{ brand.description if brand else '' }}</textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Sort Order</label>
        <input type="number" name="sort_order" value="{{ brand.sort_order if brand else 0 }}"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Logo</label>
        {% if brand and brand.logo_url %}
        <img src="{{ brand.logo_url }}" class="w-16 h-16 object-contain mb-2 rounded border">
        {% endif %}
        <input type="file" name="logo" accept="image/*"
               class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">
          {{ 'Save Changes' if brand else 'Add Brand' }}
        </button>
        <a href="/admin/brands" class="px-6 py-2 rounded-lg text-sm font-medium border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
