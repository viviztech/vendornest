{% extends "vendor/base_vendor.html" %}
{% block title %}Add Product{% endblock %}
{% block page_title %}Add Product Listing{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <form method="post" enctype="multipart/form-data" class="space-y-5" x-data="{mode: 'new'}">
      <!-- Mode toggle -->
      <div class="flex gap-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="_mode" value="new" x-model="mode" checked class="text-blue-600">
          <span class="text-sm font-medium text-gray-700">Add New Product</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="_mode" value="existing" x-model="mode" class="text-blue-600">
          <span class="text-sm font-medium text-gray-700">Use Existing Product ID</span>
        </label>
      </div>

      <!-- New product fields -->
      <div x-show="mode === 'new'" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Product Name *</label>
          <input type="text" name="product_name"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Brand *</label>
            <select name="brand_id" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Select brand</option>
              {% for b in brands %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
            <select name="category_id" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Select category</option>
              {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Product Image</label>
          <input type="file" name="image" accept="image/*"
                 class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:bg-blue-50 file:text-blue-700">
        </div>
      </div>

      <!-- Existing product ID -->
      <div x-show="mode === 'existing'">
        <label class="block text-sm font-medium text-gray-700 mb-1">Product ID</label>
        <input type="number" name="product_id"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="Enter product ID from catalog">
        <!-- Hidden required fields for existing mode -->
        <input type="hidden" name="brand_id" value="0">
        <input type="hidden" name="category_id" value="0">
      </div>

      <!-- Common fields -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Your Price (₹) *</label>
          <input type="number" name="price" step="0.01" min="0" required
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Stock Quantity</label>
          <input type="number" name="stock" value="0" min="0"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Add Listing</button>
        <a href="/vendor/products" class="px-6 py-2 rounded-lg text-sm font-medium border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
