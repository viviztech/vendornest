{% extends "base.html" %}
{% block title %}Enter OTP{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
    <div class="text-5xl mb-4">🔐</div>
    <h1 class="text-xl font-bold text-gray-900 mb-2">Enter your OTP</h1>
    <p class="text-sm text-gray-500 mb-6">Sent to <strong>{{ email }}</strong></p>
    {% if error %}<div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 text-sm mb-4">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/otp-login/verify" class="space-y-4 text-left">
      <input type="hidden" name="email" value="{{ email }}"/>
      <input type="text" name="otp" required maxlength="6" pattern="[0-9]{6}" placeholder="000000"
             class="w-full border border-gray-300 rounded-lg px-4 py-3 text-center text-2xl tracking-widest font-bold focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700">
        Verify &amp; Login
      </button>
    </form>
  </div>
</div>
{% endblock %}
