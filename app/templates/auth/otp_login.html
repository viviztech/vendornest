{% extends "base.html" %}
{% block title %}OTP Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Login with OTP</h1>
    <p class="text-gray-500 text-sm mb-6">Enter your email to receive a one-time password</p>
    {% if error %}<div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 text-sm mb-4">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/otp-login/send" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required placeholder="you@example.com"
               class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700">
        Send OTP
      </button>
    </form>
    <div class="mt-4 text-center">
      <a href="/auth/login" class="text-sm text-gray-500 hover:text-blue-600">Login with password instead</a>
    </div>
  </div>
</div>
{% endblock %}
