{% extends "base.html" %}
{% block title %}Vendor Registration{% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="max-w-2xl w-full">
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-bold text-blue-600">VendorNest</a>
      <h2 class="mt-4 text-2xl font-bold text-gray-900">Register as Vendor</h2>
      <p class="text-gray-500 text-sm mt-1">Join our hardware marketplace and reach more customers</p>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      {% if error %}<div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 text-sm mb-4">{{ error }}</div>{% endif %}
      <form method="post" class="space-y-4" x-data="{state_id: '', district_id: ''}">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Your Name *</label>
            <input type="text" name="name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
            <input type="email" name="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
            <input type="tel" name="phone" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password *</label>
            <input type="password" name="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <hr class="border-gray-100">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Business Name *</label>
            <input type="text" name="business_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">GST Number</label>
            <input type="text" name="gst_number" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Optional">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Address Line</label>
          <input type="text" name="address_line" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">State *</label>
            <select name="state_id" required x-model="state_id"
                    @change="district_id=''; fetch('/api/districts?state_id='+state_id).then(r=>r.json()).then(d=>{document.getElementById('district-sel').innerHTML='<option value=\"\">Select district</option>'+d.map(x=>'<option value=\"'+x.id+'\">'+x.name+'</option>').join('')})"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Select state</option>
              {% for s in states %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">District *</label>
            <select name="district_id" id="district-sel" required x-model="district_id"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Select district</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pincode *</label>
            <select name="pincode_id" id="pincode-sel" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Select pincode</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 mt-2">
          Register as Vendor
        </button>
      </form>
      <p class="text-center text-sm text-gray-500 mt-4">
        Already have an account? <a href="/auth/login" class="text-blue-600 hover:underline">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
