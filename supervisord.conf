[supervisord]
nodaemon=false
logfile=/var/log/vendornest/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info

[program:vendornest-api]
command=/home/ubuntu/vendornest/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/home/ubuntu/vendornest
user=ubuntu
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/vendornest/api.log
stderr_logfile=/var/log/vendornest/api.error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:vendornest-worker]
command=/home/ubuntu/vendornest/venv/bin/celery -A app.celery_app worker --loglevel=info --concurrency=2
directory=/home/ubuntu/vendornest
user=ubuntu
autostart=true
autorestart=true
stdout_logfile=/var/log/vendornest/worker.log
stderr_logfile=/var/log/vendornest/worker.error.log
stdout_logfile_maxbytes=20MB

[program:vendornest-beat]
command=/home/ubuntu/vendornest/venv/bin/celery -A app.celery_app beat --loglevel=info
directory=/home/ubuntu/vendornest
user=ubuntu
autostart=true
autorestart=true
stdout_logfile=/var/log/vendornest/beat.log
stderr_logfile=/var/log/vendornest/beat.error.log
